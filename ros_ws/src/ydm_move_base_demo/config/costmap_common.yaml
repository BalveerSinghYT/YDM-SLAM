# Common costmap parameters for both global_costmap and local_costmap.
# Uses YDM-SLAM PointCloud2 topics as obstacle sources.

obstacle_range: 5.0
raytrace_range: 6.0

robot_radius: 0.20

inflation_layer:
  inflation_radius: 0.35
  cost_scaling_factor: 10.0

# 3D obstacle representation
voxel_layer:
  enabled: true
  origin_z: 0.0
  z_resolution: 0.05
  z_voxels: 16
  max_obstacle_height: 2.0
  unknown_threshold: 15
  mark_threshold: 0

  publish_voxel_map: true
  observation_sources: static_cloud dynamic_cloud

  static_cloud:
    data_type: PointCloud2
    topic: /ydm/static_cloud
    marking: true
    clearing: true
    min_obstacle_height: 0.05
    max_obstacle_height: 2.0

  dynamic_cloud:
    data_type: PointCloud2
    topic: /ydm/dynamic_cloud
    marking: true
    clearing: true
    min_obstacle_height: 0.05
    max_obstacle_height: 2.0

# If you have a true 2D map later, you can add static_layer back.
static_layer:
  enabled: false

obstacle_layer:
  enabled: false

# Keep it simple: voxel_layer + inflation
